[package]
name = "merpati-socketio"
description = "Socket.IO v2/v3/v4 (Engine.IO 3/4, polling and WebSocket) client sessions for Merpati"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
merpati-core.workspace = true
merpati-http.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
http.workspace = true
url.workspace = true
serde_json.workspace = true
base64.workspace = true
reqwest.workspace = true
rustls.workspace = true
hyper = "1"

[dev-dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
serde_json.workspace = true
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
