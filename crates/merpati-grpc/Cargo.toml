[package]
name = "merpati-grpc"
description = "Dynamic gRPC client for Merpati: .proto files or server reflection, all four call patterns, JSON messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
merpati-core.workspace = true
merpati-http.workspace = true
tonic = { version = "0.14", default-features = false, features = ["channel"] }
tonic-reflection = { version = "0.14", default-features = false }
tonic-prost = "0.14"
prost = "0.14"
prost-types = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
protox = "0.10"
miette = { version = "7", default-features = false }
tokio.workspace = true
tokio-stream = "0.1"
tokio-util.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"
rustls.workspace = true
futures-util.workspace = true
http.workspace = true
bytes.workspace = true
base64.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "tls-ring"] }
tower = { version = "0.5", features = ["util"] }
tonic-reflection = "0.14"
rcgen = { version = "0.14", default-features = false, features = ["ring", "pem", "crypto"] }
tempfile.workspace = true
