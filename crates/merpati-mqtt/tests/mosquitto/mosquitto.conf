# Test broker for tests/mosquitto.rs, started by run.sh.
allow_anonymous true
persistence false
log_dest stdout
log_type error
log_type warning
log_type notice

# MQTT over TCP
listener 1883
protocol mqtt

# MQTT over WebSocket
listener 9001
protocol websockets

# MQTT over TLS
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key

# MQTT over secure WebSocket
listener 8884
protocol websockets
cafile /mosquitto/certs/ca.pem
certfile /mosquitto/certs/server.pem
keyfile /mosquitto/certs/server.key
