[package]
name = "merpati-mqtt"
description = "MQTT 3.1.1 and 5 client sessions for Merpati"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
merpati-core.workspace = true
merpati-http.workspace = true
# rustls without a bundled provider: the ring provider is installed by
# merpati-http and the ClientConfig is always injected, so aws-lc is never built.
# `proxy` (HTTP CONNECT) points rumqttc at the in-process bridge to the
# configured proxy, see src/bridge.rs.
rumqttc = { version = "0.25", default-features = false, features = ["use-rustls-no-provider", "websocket", "proxy"] }
base64.workspace = true
tokio.workspace = true
parking_lot.workspace = true
url.workspace = true
percent-encoding.workspace = true
rand.workspace = true

[dev-dependencies]
tokio.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
rustls.workspace = true
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["ring", "crypto"] }
