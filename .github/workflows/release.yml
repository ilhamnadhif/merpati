name: Release

# Builds the app and CLI for macOS (universal), Linux and Windows when a `v*`
# tag is pushed, then publishes one GitHub release with every file and the
# matching CHANGELOG section as its notes. Signing and notarization run only
# when the Apple secrets below are configured; otherwise the app is signed
# ad hoc.
#
#   APPLE_CERTIFICATE_P12       base64 of the "Developer ID Application" .p12
#   APPLE_CERTIFICATE_PASSWORD  its password
#   APPLE_SIGN_IDENTITY         e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarytool

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    env:
      # Secrets cannot appear in `if:` directly; empty when not configured.
      APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches the crate version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $version"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Import signing certificate
        if: env.APPLE_CERTIFICATE_P12 != ''
        env:
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          rm cert.p12
      - name: Notary credentials
        if: env.APPLE_ID != ''
        run: |
          xcrun notarytool store-credentials merpati-notary --apple-id "$APPLE_ID" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" --password "${{ secrets.APPLE_APP_PASSWORD }}"
          echo "MERPATI_NOTARY_PROFILE=merpati-notary" >> "$GITHUB_ENV"
      - name: Package
        env:
          MERPATI_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: scripts/package-macos.sh
      # Checksums for people checking downloads by hand (the in-app updater
      # also accepts the SHA-256 digest GitHub publishes for each file).
      - name: Checksums
        run: cd target/dist-pkg && shasum -a 256 *.dmg *.zip *.tar.gz > SHA256SUMS-macos.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            target/dist-pkg/*.dmg
            target/dist-pkg/*.zip
            target/dist-pkg/*.tar.gz
            target/dist-pkg/merpati.rb
            target/dist-pkg/SHA256SUMS-macos.txt

  linux:
    # Built on Ubuntu 22.04 so the packages also run on older distributions
    # (checked below on Ubuntu, Debian, Fedora, Rocky Linux and openSUSE).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libdbus-1-dev dpkg-dev rpm
      - run: cargo build --profile dist --locked -p merpati-app -p merpati-cli
      - name: Package (.tar.gz, .deb, .rpm, .AppImage)
        run: scripts/package-linux.sh
      - name: Install and run on other distributions
        run: |
          cd target/dist-pkg
          deb=$(ls *.deb); rpm=$(ls *.rpm); appimage=$(ls *.AppImage)
          check='merpati --version && if ldd /usr/bin/merpati-app | grep "not found"; then exit 1; fi'
          for image in ubuntu:22.04 ubuntu:24.04 debian:12; do
            echo "== $image"
            docker run --rm -v "$PWD:/pkg:ro" "$image" bash -ec \
              "apt-get update -qq && DEBIAN_FRONTEND=noninteractive apt-get install -y -qq /pkg/$deb >/dev/null && $check"
          done
          for image in fedora:41 rockylinux:9; do
            echo "== $image"
            docker run --rm -v "$PWD:/pkg:ro" "$image" bash -ec "dnf install -y -q /pkg/$rpm >/dev/null && $check"
          done
          echo "== opensuse/leap:15.6"
          docker run --rm -v "$PWD:/pkg:ro" opensuse/leap:15.6 bash -ec \
            "zypper --non-interactive --quiet install --allow-unsigned-rpm /pkg/$rpm >/dev/null && $check"
          echo "== AppImage"
          chmod +x "$appimage"
          (mkdir -p /tmp/ai && cd /tmp/ai && "$OLDPWD/$appimage" --appimage-extract >/dev/null && squashfs-root/usr/bin/merpati --version)
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            target/dist-pkg/*.tar.gz
            target/dist-pkg/*.deb
            target/dist-pkg/*.rpm
            target/dist-pkg/*.AppImage
            target/dist-pkg/SHA256SUMS-linux-*.txt

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --profile dist --locked -p merpati-app -p merpati-cli
      - name: Package (installer and portable .zip)
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force target/dist-pkg, pkg | Out-Null
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y | Out-Null
            $env:Path += ";${env:ProgramFiles(x86)}\Inno Setup 6"
          }
          iscc /Q "/DAppVersion=$v" "/DSourceDir=$PWD\target\dist" "/DOutputDir=$PWD\target\dist-pkg" packaging\windows\merpati.iss
          Copy-Item target/dist/merpati-app.exe, target/dist/merpati.exe, README.md, LICENSE-MIT, LICENSE-APACHE pkg/
          Compress-Archive -Path pkg/* -DestinationPath "target/dist-pkg/merpati-$v-windows-x86_64.zip"
          Push-Location target/dist-pkg
          Get-ChildItem *.exe, *.zip | ForEach-Object { "$((Get-FileHash -Algorithm SHA256 $_.Name).Hash.ToLower())  $($_.Name)" } |
            Out-File -Encoding ascii SHA256SUMS-windows.txt
          Pop-Location
      - name: Install, run and uninstall
        shell: pwsh
        run: |
          $setup = (Get-ChildItem target/dist-pkg/Merpati-Setup-*.exe).FullName
          Start-Process -Wait -FilePath $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER'
          $dir = "$env:LOCALAPPDATA\Programs\Merpati"
          & "$dir\merpati.exe" --version
          if (-not (Test-Path "$dir\merpati-app.exe") -or -not (Test-Path "$dir\unins000.exe")) { throw "not installed" }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART'
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            target/dist-pkg/Merpati-Setup-*.exe
            target/dist-pkg/merpati-*-windows-x86_64.zip
            target/dist-pkg/SHA256SUMS-windows.txt

  publish:
    # One job creates the release, so parallel builds never race to create it.
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The CHANGELOG section of this version, without its heading.
          awk -v v="$version" '
            /^## / { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          name: Merpati ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
